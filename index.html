    <!-- Runs before paint; sets the theme before the first paint to prevent a flash.
         data-cfasync="false" keeps Cloudflare Rocket Loader from deferring it. -->
    <script data-cfasync="false">
        (function() {
            var savedTheme = null;
            try {
                savedTheme = localStorage.getItem('theme');
            } catch (e) {
                // Storage unavailable: fall through to the system preference.
            }
            var dark = savedTheme === 'dark' || (savedTheme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
            document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        })();
    </script>
